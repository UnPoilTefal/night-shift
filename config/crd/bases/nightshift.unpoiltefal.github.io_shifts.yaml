---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: shifts.nightshift.unpoiltefal.github.io
spec:
  group: nightshift.unpoiltefal.github.io
  names:
    kind: Shift
    listKind: ShiftList
    plural: shifts
    singular: shift
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.trigger.schedule.cron
      name: Schedule
      type: string
    - jsonPath: .status.activePass
      name: Active
      type: string
    - jsonPath: .status.lastScheduleTime
      name: Last
      type: date
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Shift is a team's self-service declaration asking night-shift to run passes
          on a ticket source, on a trigger.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Shift
            properties:
              failedPassesHistoryLimit:
                default: 1
                description: failedPassesHistoryLimit is how many failed passes are
                  kept.
                format: int32
                minimum: 0
                type: integer
              mission:
                description: |-
                  mission is the kind of work this shift's passes do. Exactly one member
                  must be set.
                properties:
                  tickets:
                    description: tickets processes the ready tickets of a ticket source.
                    properties:
                      source:
                        description: source is where the ready tickets live.
                        properties:
                          fake:
                            description: fake reads tickets from a ConfigMap, for
                              demonstrations and tests.
                            properties:
                              configMapName:
                                description: configMapName names the ConfigMap that
                                  lists the tickets.
                                minLength: 1
                                type: string
                            required:
                            - configMapName
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one ticket source must be set
                          rule: '[has(self.fake)].filter(x, x).size() == 1'
                    required:
                    - source
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one mission must be set
                  rule: '[has(self.tickets)].filter(x, x).size() == 1'
              successfulPassesHistoryLimit:
                default: 3
                description: successfulPassesHistoryLimit is how many succeeded passes
                  are kept.
                format: int32
                minimum: 0
                type: integer
              trigger:
                description: trigger decides when passes start. Exactly one member
                  must be set.
                properties:
                  schedule:
                    description: schedule starts a pass at each occurrence of a cron
                      expression.
                    properties:
                      cron:
                        description: cron is a standard five-field cron expression,
                          e.g. "0 2 * * *".
                        minLength: 1
                        type: string
                      timeZone:
                        description: timeZone is an IANA time zone name, e.g. "Europe/Paris".
                          Defaults to UTC.
                        type: string
                    required:
                    - cron
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one trigger must be set
                  rule: '[has(self.schedule)].filter(x, x).size() == 1'
            required:
            - mission
            - trigger
            type: object
          status:
            description: status defines the observed state of Shift
            properties:
              activePass:
                description: activePass names the pass currently pending or running,
                  if any.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the Shift. "Ready" is false
                  when the trigger cannot be scheduled.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScheduleTime:
                description: lastScheduleTime is the last time a pass was due.
                format: date-time
                type: string
              nextScheduleTime:
                description: nextScheduleTime is the next time a pass is due.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 52 characters, so that pass and job names
            stay valid
          rule: self.metadata.name.size() <= 52
    served: true
    storage: true
    subresources:
      status: {}
