# This rule is not used by the project night-shift itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nightshift.unpoiltefal.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: night-shift
    app.kubernetes.io/managed-by: kustomize
  name: pass-viewer-role
rules:
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - passes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - passes/status
  verbs:
  - get
