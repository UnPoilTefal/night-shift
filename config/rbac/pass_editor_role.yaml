# This rule is not used by the project night-shift itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the nightshift.unpoiltefal.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: night-shift
    app.kubernetes.io/managed-by: kustomize
  name: pass-editor-role
rules:
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - passes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - passes/status
  verbs:
  - get
