# This rule is not used by the project night-shift itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over nightshift.unpoiltefal.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: night-shift
    app.kubernetes.io/managed-by: kustomize
  name: shift-admin-role
rules:
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - shifts
  verbs:
  - '*'
- apiGroups:
  - nightshift.unpoiltefal.github.io
  resources:
  - shifts/status
  verbs:
  - get
