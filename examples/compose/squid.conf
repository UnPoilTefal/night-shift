# Proxy de sortie de l'agent, figé : il ne s'adapte que par les listes
# d'allowlist/. Le test statique (compose_test.go) refuse toute autre
# modification qui affaiblirait une règle : ordre des refus, au plus une
# exception privée, aucun allow all.
#
# Seul CONNECT vers le port 443 passe : aucun HTTP en clair, aucun
# déchiffrement. Les plages privées et réservées sont refusées avant toute
# autorisation, pour qu'un nom autorisé qui résoudrait vers le réseau local
# (rebinding DNS) n'y mène pas.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl private_dst dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl private_dst dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
# Squid range les adresses IPv4 en IPv6 mappées : ::ffff:0:0/96 désignerait
# 0.0.0.0/0 et n'a pas sa place ici, les plages IPv4 ci-dessus le couvrent.
acl private_dst dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001::/23
acl private_dst dst 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8

acl model dstdomain "/etc/squid/allowlist/model.txt"
acl toolchain dstdomain "/etc/squid/allowlist/toolchain.txt"

http_access deny !CONNECT
http_access deny !SSL_ports

# Passerelle LLM privée (docs/compose.md) : la seule exception admise, qui
# exige à la fois le domaine et l'adresse exacte. Elle se place ici, avant le
# refus des plages privées :
#
#   acl llm_gateway_name dstdomain llm.internal.example
#   acl llm_gateway_addr dst 10.20.30.40/32
#   http_access allow CONNECT SSL_ports llm_gateway_name llm_gateway_addr

http_access deny private_dst
http_access allow model
http_access allow toolchain
http_access deny all

# Aucun cache : le proxy ne fait que relayer des tunnels.
cache deny all
# Sans capacité réseau brute, le pinger ICMP ne peut pas démarrer.
pinger_enable off

# access.log par défaut : le point d'entrée de l'image le recopie dans
# docker logs, refus (TCP_DENIED) compris.
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
