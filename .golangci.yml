version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - revive
    - unconvert
  exclusions:
    rules:
      - path: (_test\.go|internal/testgit/|test/)
        linters: [gosec]
      # Ginkgo et Gomega s'importent par convention en dot import.
      - path: _test\.go
        linters: [revive]
        text: dot-imports

formatters:
  enable:
    - gofmt
    - goimports
